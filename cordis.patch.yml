# dsh-mattermost: reuses the existing DSH process (no second application process).
# Mattermost becomes a task entry point; DSH keeps owning the session/agent runtime.
#
# Every value is env-driven with production-appropriate defaults. There is no
# test path, no test channel and no self-message bypass anywhere in this file.
- insert:
    - id: mattermost
      name: dsh-mattermost
      config:
        baseUrl: !!js process.env.MATTERMOST_URL || ''
        tokenRef: MATTERMOST_TOKEN
        cwd: !!js process.env.MATTERMOST_CWD || process.cwd()

        # Empty = every channel the bot is in. Production should list them.
        channels: !!js (process.env.MATTERMOST_CHANNELS || '').split(',').filter(Boolean)
        # Channels that answer without an @mention. Production should stay empty.
        freeResponseChannels: !!js (process.env.MATTERMOST_FREE || '').split(',').filter(Boolean)
        requireMention: true

        # Default-deny user authorization.
        allowedUsers: !!js (process.env.MATTERMOST_ALLOWED_USERS || '').split(',').filter(Boolean)
        allowAll: !!js process.env.MATTERMOST_ALLOW_ALL === '1'

        # Bot-to-bot loop budget (same semantics as the production bridge).
        allowBotMentions: !!js process.env.MATTERMOST_ALLOW_BOT_MENTIONS !== '0'
        botChainMax: !!js Number(process.env.MATTERMOST_BOT_CHAIN_MAX || 5)
        botChainWindowMs: !!js Number(process.env.MATTERMOST_BOT_CHAIN_WINDOW_MS || 120000)

        # Idle live-agent eviction (sessions themselves stay durable).
        idleAgentTtlMs: !!js Number(process.env.MATTERMOST_IDLE_TTL_MS || 1800000)
        idleSweepIntervalMs: !!js Number(process.env.MATTERMOST_SWEEP_MS || 60000)

        # Approval Bridge. `MATTERMOST_APPROVAL_ENABLED=0` makes this plugin
        # decline to answer, so every request falls through to `next()` exactly
        # as before the feature existed (it never overrides DSH's own policy).
        approvalEnabled: !!js process.env.MATTERMOST_APPROVAL_ENABLED !== '0'
        approvalTimeoutMs: !!js Number(process.env.MATTERMOST_APPROVAL_TIMEOUT_MS || 300000)
        # Whether a WEB-origin card renders the tool arguments ('off' | 'masked').
        # Mattermost-origin cards are unaffected.
        approvalCardArguments: !!js process.env.MATTERMOST_APPROVAL_CARD_ARGUMENTS || 'off'

        # Web-origin approval routing (Approval Bridge A1). Every field is empty
        # or off by default, which means "no announcement" — the browser prompt
        # alone answers, exactly as before this feature existed.
        #
        # `approvers` must be a subset of `allowedUsers`; a configuration that
        # reaches beyond it is rejected at startup and the feature stays off.
        webApproval:
          channel: !!js process.env.MATTERMOST_WEB_APPROVAL_CHANNEL || ''
          binding: !!js JSON.parse(process.env.MATTERMOST_WEB_APPROVAL_BINDING || '{}')
          auto: !!js process.env.MATTERMOST_WEB_APPROVAL_AUTO === '1'
          ttlMs: !!js Number(process.env.MATTERMOST_WEB_APPROVAL_TTL_MS || 86400000)
          approvers: !!js (process.env.MATTERMOST_WEB_APPROVAL_APPROVERS || '').split(',').filter(Boolean)

        # Multiple bots, as a JSON array of {id, baseUrl, tokenRef, channels,
        # allowedUsers, ...}. Unset = the flat fields above describe bot #0, so
        # a single-bot deployment needs no change at all.
        bots: !!js JSON.parse(process.env.MATTERMOST_BOTS || '[]')

        # Empty = $DSH_HOME/mattermost.
        stateDir: !!js process.env.MATTERMOST_STATE_DIR || ''
        backfill: true
        debug: !!js process.env.MATTERMOST_DEBUG === '1'
